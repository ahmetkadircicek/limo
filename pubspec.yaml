name: limo
description: "Professional transportation solutions app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0 

dependencies:
  # --- Flutter SDK ---
  flutter:
    sdk: flutter

  # --- UI & Design ---
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  font_awesome_flutter: ^10.9.0
  lottie: ^3.3.1

  # --- State Management ---
  provider: ^6.1.5

  # --- Routing ---
  go_router: ^16.1.0
  url_launcher: ^6.3.0

  # --- Internationalization & Formatting ---
  intl: ^0.20.2

  # --- Input & Form Utilities ---
  mask_text_input_formatter: ^2.9.0
  image_picker: ^1.1.2

  # --- Country & Region Selection ---
  country_code_picker: ^3.0.0

  # --- Maps & Location ---
  google_maps_flutter: ^2.8.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # --- Storage & Persistence ---
  path_provider: ^2.1.4
  shared_preferences: ^2.2.2

  # --- Networking ---
  http: ^1.2.2

  # --- Security & Encryption ---
  encrypt: ^5.0.3
  crypto: ^3.0.3
  pointycastle: ^3.7.3

  # --- Logging ---
  logger: ^2.6.1

  # --- Environment Configuration ---
  flutter_dotenv: ^5.1.0

  # --- Authentication ---
  google_sign_in: ^7.1.1
  sign_in_with_apple: ^5.0.0
  dio: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/png/image/
    - assets/lottie/
    - .env

flutter_icons:
  android: true
  ios: true
  image_path: assets/png/image/image_appicon.png
