<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bgLimo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b10"/>
      <stop offset="50%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bgLimo)"/>
  
  <circle cx="160" cy="120" r="160" fill="#f59e0b" fill-opacity="0.10" filter="url(#glow)"/>
  <circle cx="1040" cy="300" r="160" fill="#3b82f6" fill-opacity="0.10" filter="url(#glow)"/>

  <rect x="1.5" y="1.5" width="1197" height="417" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Badge / Pill -->
  <g transform="translate(80, 60)">
    <rect width="210" height="30" rx="15" fill="#1f293d" stroke="#374151" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#fbbf24"/>
    <text x="32" y="20" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">VIP MOBILITY PLATFORM</text>
  </g>

  <!-- Title -->
  <text x="80" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
    Limo <tspan fill="url(#goldAccent)">Mobile Solutions</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="200" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Professional chauffeured fleet operations, dynamic job dispatching, and real-time navigation.
  </text>

  <!-- Stack Pills -->
  <g transform="translate(80, 255)">
    <rect width="150" height="38" rx="10" fill="#171f2e" stroke="#374151" stroke-width="1"/>
    <text x="18" y="24" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Flutter · Dart</text>

    <rect x="162" width="170" height="38" rx="10" fill="#171f2e" stroke="#374151" stroke-width="1"/>
    <text x="180" y="24" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Google Maps SDK</text>

    <rect x="344" width="165" height="38" rx="10" fill="#171f2e" stroke="#374151" stroke-width="1"/>
    <text x="362" y="24" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Fleet Dispatching</text>

    <rect x="521" width="155" height="38" rx="10" fill="#171f2e" stroke="#374151" stroke-width="1"/>
    <text x="539" y="24" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Live Telemetry</text>
  </g>

  <!-- Route Card on Right -->
  <g transform="translate(810, 80)">
    <rect width="310" height="260" rx="16" fill="#070a10" stroke="#1f293d" stroke-width="1.5"/>
    
    <!-- Card Header -->
    <text x="24" y="38" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">VIP TRIP DISPATCH</text>
    <rect x="220" y="24" width="65" height="20" rx="10" fill="#065f46"/>
    <text x="232" y="38" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">ACTIVE</text>

    <!-- Route Nodes -->
    <g transform="translate(24, 75)">
      <circle cx="8" cy="8" r="6" fill="#3b82f6"/>
      <line x1="8" y1="18" x2="8" y2="58" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>
      <text x="28" y="12" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Istanbul Airport (IST)</text>
      <text x="28" y="30" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Terminal 2 VIP Pick-up</text>
    </g>

    <g transform="translate(24, 150)">
      <circle cx="8" cy="8" r="6" fill="#fbbf24"/>
      <text x="28" y="12" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Ciragan Palace Kempinski</text>
      <text x="28" y="30" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Bosphorus Suite Drop-off</text>
    </g>

    <!-- Metric Pill inside card -->
    <g transform="translate(24, 210)">
      <rect width="262" height="34" rx="8" fill="#111827"/>
      <text x="16" y="22" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Distance: <tspan fill="#f3f4f6" font-weight="600">41.2 km</tspan></text>
      <text x="140" y="22" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">ETA: <tspan fill="#34d399" font-weight="600">38 mins</tspan></text>
    </g>
  </g>

  <!-- Author note -->
  <g transform="translate(80, 360)">
    <text x="0" y="0" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">
      Engineered by <tspan fill="#e5e7eb" font-weight="600">Ahmet Kadir Çiçek</tspan> · github.com/ahmetkadircicek/limo
    </text>
  </g>
</svg>
